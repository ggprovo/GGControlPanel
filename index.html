function selectRoom(roomKey) {

    const room = rooms[roomKey];

    if (!room) {
        console.error("Unknown room:", roomKey);
        return;
    }

    currentRoom = roomKey;

    document.getElementById("mummyPanel").style.display =
    roomKey === "egyptian" ? "block" : "none";

    // Open all room links in new tabs
    openedLinks = {};

    room.links.forEach(link => {
        const tab = window.open(link.link, "_blank");

        if (link.id !== undefined) {
            openedLinks[link.id] = tab;
        }
    });

    ip1 = room.ip1;
    ip2 = room.ip2;

    console.log("Selected room:", room.name);
    console.log("Camera 1:", ip1);
    console.log("Camera 2:", ip2);

    document.getElementById("roomSelection").style.display = "none";
    document.getElementById("controller").style.display = "block";

    document.body.style.backgroundImage =
        `url("${room.background}")`;

    loadAudio(room);

    resetPuzzles();
    startViewer();
}


/* =========================================================
   AUDIO
   ========================================================= */

function loadAudio(room) {

    const audioPlayer =
        document.getElementById("audioPlayer");

    audioPlayer.innerHTML = "";

    room.sounds.forEach((sound, index) => {

        const item =
            document.createElement("div");

        item.className = "audioItem";


        const caption =
            document.createElement("figcaption");

        caption.textContent =
            sound.name + ":";


        const audio =
            document.createElement("audio");
        
        audio.controls = true;
        audio.src = sound.file;
        audio.dataset.pauses = sound.pauses;
        
        if (sound.loop) {
            audio.loop = true;
        }


        /*
         * Stop every other sound when a new
         * sound starts.
         */

        audio.addEventListener("play", () => {
        
            document
                .querySelectorAll("#audioPlayer audio")
                .forEach(other => {
        
                    if (other !== audio && other.dataset.pauses === "true") {
                        other.pause();
                        other.currentTime = 0;
                    }
        
                });
        
            // Close the corresponding tab
            if (sound.id !== undefined) {
                const tab = openedLinks[sound.id];
        
                if (tab && !tab.closed) {
                    tab.close();
                    delete openedLinks[sound.id];
                }
            }
        
        });


        item.appendChild(caption);
        item.appendChild(audio);

   PUZZLE SYSTEM

let puzzleCompletionTimes = {};

 * Whether the completed-puzzle dropdown

/* =========================================================

   ========================================================= */

function resetPuzzles() {

/* =========================================================
   CHECK IF PUZZLE IS AVAILABLE
   ========================================================= */

function isPuzzleAvailable(puzzle) {

    return puzzle.requires.every(
        requirement =>
            completedPuzzles.includes(
                requirement
            )
    );

}


/* =========================================================
   COMPLETE PUZZLE
   ========================================================= */

function checkRoomCompletion() {
    if (!currentRoom) return;
    const room = rooms[currentRoom];
    
    const allCompleted = room.puzzles.every(p => completedPuzzles.includes(p.name));

    if (allCompleted) {
        pauseTimer();

        // Format the current timerRemaining into MM:SS (using your existing time formatting function)
        const formattedTime = formatPuzzleTime(timerRemaining);
        
        // Populate the input field so it's ready and editable
        document.getElementById("finishedTimeInput").value = formattedTime;

        // Show the draggable submit panel
        document.getElementById("submitPanel").style.display = "block";
    }
}

function submitRoomData() {
    const submitName = document.getElementById("submitNameInput").value;
    const finishedTimeString = document.getElementById("finishedTimeInput").value;
    const selectedOption = document.querySelector('input[name="completionStatus"]:checked').value;

    // Build a map of column letters to completion times based on the room configuration
    const room = rooms[currentRoom];
    const puzzleColumnData = {};

    room.puzzles.forEach(puzzle => {
        if (puzzle.column && puzzleCompletionTimes[puzzle.name] !== undefined) {
            puzzleColumnData[puzzle.column] = puzzleCompletionTimes[puzzle.name];
        }
    });

    const payload = {
        name: submitName || "Anonymous",
        room: room.name, // Sends "Heist", "Reactor", or "Egyptian"
        finishedTime: finishedTimeString,
        status: selectedOption,
        puzzleColumns: puzzleColumnData // Sends something like { "D": 1820, "E": 1750, ... }
    };

    // REPLACE THIS URL with your actual Google Apps Script Web App URL
    const webAppUrl = "https://script.google.com/macros/s/AKfycbxu7gLdoNdFGrmXPeevBAs3sDInXAlj-J-V1TE77HAmQOAKZC9N27IgvKKhkGk4uVvW/exec";

    fetch(webAppUrl, {
        method: "POST",
        mode: "no-cors",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
    })
    .then(() => {
        alert("Successfully submitted to Google Sheets!");
        document.getElementById("submitPanel").style.display = "none";
    })
    .catch(error => {
        console.error("Error submitting data:", error);
        alert("There was an error saving your data.");
    });
}
  
function completePuzzle(puzzleName) {

    if (!currentRoom) return;


    /*
     * Don't allow the same puzzle
     * to be completed twice.
     */

    if (
        completedPuzzles.includes(
            puzzleName
        )
    ) {

        return;

    }


    const room =
        rooms[currentRoom];


    const puzzle =
        room.puzzles.find(
            p => p.name === puzzleName
        );


    if (!puzzle) {

        console.error(
            "Puzzle not found:",
            puzzleName
        );

        return;

    }


    /*
     * Make sure its prerequisites
     * have actually been completed.
     */

    if (
        !isPuzzleAvailable(
            puzzle
        )
    ) {

        console.warn(
            "Puzzle is not available:",
            puzzleName
        );

        return;

    }


    /*
     * Record the puzzle as completed.
     */

    completedPuzzles.push(
        puzzleName
    );


    /*
     * IMPORTANT:
     *
     * Record how much time is LEFT
     * on the room timer.
     */

    puzzleCompletionTimes[puzzleName] =
        timerRemaining;


    console.log(
        "Puzzle completed:",
        puzzleName,
        "Time remaining:",
        formatPuzzleTime(
            timerRemaining
        )
    );


    /*
     * Rebuild the puzzle list.
     *
     * This removes the completed puzzle
     * and reveals anything that is now
     * available.
     */

    renderPuzzles();

    checkRoomCompletion();

}

/* =========================================================
   UNDO PUZZLE
   ========================================================= */

function undoPuzzle(puzzleName) {

    if (!currentRoom) return;

    const room = rooms[currentRoom];

    /*
     * Find this puzzle and every puzzle that
     * directly or indirectly depends on it.
     */

    const toRemove = new Set([puzzleName]);

    let changed = true;

    while (changed) {

        changed = false;

        room.puzzles.forEach(puzzle => {

            if (toRemove.has(puzzle.name)) {
                return;
            }

            /*
             * If any prerequisite is being removed,
             * this puzzle has to be removed too.
             */

            if (
                puzzle.requires.some(
                    requirement =>
                        toRemove.has(requirement)
                )
            ) {

                toRemove.add(puzzle.name);
                changed = true;

            }

        });

    }

    /*
     * Remove all affected puzzles.
     */

    completedPuzzles =
        completedPuzzles.filter(
            name => !toRemove.has(name)
        );

    /*
     * Remove their saved completion times too.
     */

    toRemove.forEach(name => {
        delete puzzleCompletionTimes[name];
    });

    console.log(
        "Undid puzzles:",
        [...toRemove]
    );

    renderPuzzles();

}

/* =========================================================
   EDIT PUZZLE TIME
   ========================================================= */

function editPuzzleTime(puzzleName, timeElement) {

    /*
     * Don't create another input if one already exists.
     */

    if (
        timeElement.querySelector(
            ".completedPuzzleTimeInput"
        )
    ) {
        return;
    }

    const currentTime =
        formatPuzzleTime(
            puzzleCompletionTimes[puzzleName]
        );

    const input =
        document.createElement("input");

    input.className =
        "completedPuzzleTimeInput";

    input.type = "text";

    input.value = currentTime;

    input.maxLength = 5;

    timeElement.textContent = "";

    timeElement.appendChild(input);

    input.focus();

    input.select();


    function saveTime() {

        const value =
            input.value.trim();

        /*
         * Require MM:SS
         */

        const match =
            value.match(
                /^(\d+):([0-5]\d)$/
            );

        if (!match) {

            /*
             * Invalid input:
             * restore the old value.
             */

            timeElement.textContent =
                formatPuzzleTime(
                    puzzleCompletionTimes[puzzleName]
                );

            return;

        }

        const minutes =
            parseInt(match[1], 10);

        const seconds =
            parseInt(match[2], 10);

        puzzleCompletionTimes[puzzleName] =
            minutes * 60 + seconds;

        timeElement.textContent =
            formatPuzzleTime(
                puzzleCompletionTimes[puzzleName]
            );

        console.log(
            "Updated puzzle time:",
            puzzleName,
            formatPuzzleTime(
                puzzleCompletionTimes[puzzleName]
            )
        );

    }


    input.addEventListener(
        "keydown",
        event => {

            if (event.key === "Enter") {

                saveTime();

            }

            if (event.key === "Escape") {

                timeElement.textContent =
                    formatPuzzleTime(
                        puzzleCompletionTimes[
                            puzzleName
                        ]
                    );

            }

        }
    );


    input.addEventListener(
        "blur",
        saveTime
    );

}
/* =========================================================
   FORMAT TIMER VALUE
   ========================================================= */

function formatPuzzleTime(seconds) {

    seconds =
        Math.max(
            0,
            Math.floor(seconds)
        );


    const minutes =
        Math.floor(
            seconds / 60
        );


    const remainingSeconds =
        seconds % 60;


    return (
        minutes
            .toString()
            .padStart(2, "0")
        +
        ":" +
        remainingSeconds
            .toString()
            .padStart(2, "0")
    );

}

/* =========================================================
   RENDER PUZZLES
   ========================================================= */

function renderPuzzles() {

    const availableContainer =
        document.getElementById(
            "availablePuzzles"
        );


    const completedContainer =
        document.getElementById(
            "completedPuzzles"
        );


    if (
        !availableContainer ||
        !completedContainer
    ) {

        return;

    }


    availableContainer.innerHTML =
        "";

    completedContainer.innerHTML =
        "";


    /*
     * Don't do anything if no room
     * has been selected.
     */

    if (!currentRoom) {

        return;

    }


    const room =
        rooms[currentRoom];


    /* =====================================================
       AVAILABLE PUZZLES
       ===================================================== */

    room.puzzles.forEach(
        puzzle => {

            /*
             * Don't display completed puzzles.
             */

            if (
                completedPuzzles.includes(
                    puzzle.name
                )
            ) {

                return;

            }


            /*
             * Don't display puzzles
             * whose prerequisites aren't done.
             */

            if (
                !isPuzzleAvailable(
                    puzzle
                )
            ) {

                return;

            }


            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "puzzleButton";


            button.textContent =
                puzzle.name;


            button.addEventListener(
                "click",
                () => {

                    completePuzzle(
                        puzzle.name
                    );

                }
            );


            availableContainer.appendChild(
                button
            );

        }
    );


    /*
     * No available puzzles.
     */

    if (
        availableContainer.children.length === 0
    ) {

        const empty =
            document.createElement(
                "div"
            );


        empty.textContent =
            "No puzzles currently available.";


        empty.style.color =
            "#888";


        empty.style.padding =
            "5px";


        availableContainer.appendChild(
            empty
        );

    }


    /* =====================================================
       COMPLETED PUZZLES
       ===================================================== */

    completedPuzzles.forEach(
    puzzleName => {

        const row =
            document.createElement(
                "div"
            );

        row.className =
            "completedPuzzle";


        /*
         * Puzzle name
         */

        const name =
            document.createElement(
                "span"
            );

        name.className =
            "completedPuzzleName";

        name.textContent =
            puzzleName;


        /*
         * Right side of the row
         */

        const rightSide =
            document.createElement(
                "span"
            );

        rightSide.style.display =
            "flex";

        rightSide.style.alignItems =
            "center";


        /*
         * Completion time
         */

        const time =
            document.createElement(
                "span"
            );

        time.className =
            "completedPuzzleTime";

        time.textContent =
            formatPuzzleTime(
                puzzleCompletionTimes[
                    puzzleName
                ]
            );


        /*
         * Clicking the time allows it
         * to be manually edited.
         */

        time.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                editPuzzleTime(
                    puzzleName,
                    time
                );

            }
        );


        /*
         * Undo button
         */

        const undo =
            document.createElement(
                "button"
            );

        undo.className =
            "undoButton";

        undo.textContent =
            "Undo";

        undo.title =
            "Undo this puzzle and everything that depends on it";


        undo.addEventListener(
            "click",
            event => {

                /*
                 * Don't let clicking Undo
                 * trigger anything else.
                 */

                event.stopPropagation();

                undoPuzzle(
                    puzzleName
                );

            }
        );


        rightSide.appendChild(
            time
        );

        rightSide.appendChild(
            undo
        );


        row.appendChild(
            name
        );

        row.appendChild(
            rightSide
        );


        completedContainer.appendChild(
            row
        );

    }
);

}

/* =========================================================
   ROOM-SPECIFIC PTZ DIRECTION
   ========================================================= */

function getRoomAdjustedCommand(command) {

    /*
     * Heist cameras are physically mounted/oriented
     * opposite to the other rooms.
     *
     * Therefore, reverse the directional controls
     * only when Heist is selected.
     */

    if (currentRoom == "heist") {
        return command;
    }


    const reverseMap = {

        ptzMoveUp: "ptzMoveDown",
        ptzMoveDown: "ptzMoveUp",

        ptzMoveLeft: "ptzMoveRight",
        ptzMoveRight: "ptzMoveLeft",

        ptzMoveTopLeft: "ptzMoveBottomRight",
        ptzMoveTopRight: "ptzMoveBottomLeft",

        ptzMoveBottomLeft: "ptzMoveTopRight",
        ptzMoveBottomRight: "ptzMoveTopLeft"

    };


    return reverseMap[command] || command;

}


/* =========================================================
   CAMERA COMMANDS
   ========================================================= */

function sendCommand(command, ip) {

    const commandMap = {

        ptzMoveUp: 0,
        ptzMoveDown: 2,

        ptzMoveLeft: 6,
        ptzMoveRight: 4,

        ptzMoveTopLeft: 91,
        ptzMoveTopRight: 90,

        ptzMoveBottomLeft: 93,
        ptzMoveBottomRight: 92,

        ptzReset: 25,

        ptzStopRun: 1

    };


    const cmdValue =
        commandMap[command];


    if (cmdValue === undefined) {

        console.error(
            "Unknown PTZ command:",
            command
        );

        return;

    }


    if (!ip) {

        console.error(
            "No camera IP selected."
        );

        return;

    }


    const url =
        `http://${ip}/decoder_control.cgi?user=${username}&pwd=${password}&command=${cmdValue}`;


    console.log(
        "Sending command:",
        command,
        "→",
        cmdValue,
        "to",
        ip
    );


    fetch(url)

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "Camera command failed: " +
                    response.statusText
                );

            }

            return response.text();

        })

        .then(data => {

            console.log(
                "Camera responded:",
                data
            );

        })

        .catch(error => {

            console.error(
                "Error sending command:",
                error
            );

        });

}

/* =========================================================
   DRAGGABLE WINDOWS
   ========================================================= */

function makeDraggable(panel, handle) {

    let dragging = false;

    let startMouseX = 0;
    let startMouseY = 0;

    let startLeft = 0;
    let startTop = 0;


    handle.addEventListener(
        "pointerdown",
        function(event) {

            /*
             * Only the drag handle starts dragging.
             * Buttons/audio controls remain clickable.
             */

            dragging = true;

            panel.classList.add("dragging");

            startMouseX = event.clientX;
            startMouseY = event.clientY;

            const rect =
                panel.getBoundingClientRect();

            startLeft = rect.left;
            startTop = rect.top;


            /*
             * Convert from the current position
             * to explicit left/top coordinates.
             */

            panel.style.left =
                startLeft + "px";
            
            panel.style.top =
                startTop + "px";
            
            panel.style.right =
                "auto";
            
            panel.style.bottom =
                "auto";


            handle.setPointerCapture(
                event.pointerId
            );


            event.preventDefault();

        }
    );


    handle.addEventListener(
        "pointermove",
        function(event) {

            if (!dragging) return;


            const deltaX =
                event.clientX - startMouseX;

            const deltaY =
                event.clientY - startMouseY;


            let newLeft =
                startLeft + deltaX;

            let newTop =
                startTop + deltaY;


            /*
             * Keep the panel at least partially
             * inside the screen.
             */

            const rect =
                panel.getBoundingClientRect();


            const maxLeft =
                window.innerWidth -
                rect.width;


            const maxTop =
                window.innerHeight -
                rect.height;


            newLeft =
                Math.max(
                    0,
                    Math.min(
                        newLeft,
                        maxLeft
                    )
                );


            newTop =
                Math.max(
                    0,
                    Math.min(
                        newTop,
                        maxTop
                    )
                );


            panel.style.left =
                newLeft + "px";

            panel.style.top =
                newTop + "px";

        }
    );


    handle.addEventListener(
        "pointerup",
        function(event) {

            dragging = false;

            panel.classList.remove(
                "dragging"
            );

            try {

                handle.releasePointerCapture(
                    event.pointerId
                );

            } catch (e) {}

        }
    );


    handle.addEventListener(
        "pointercancel",
        function() {

            dragging = false;

            panel.classList.remove(
                "dragging"
            );

        }
    );

}

/* =========================================================
   WINDOW RESIZE
   ========================================================= */

window.addEventListener(
    "resize",
    function() {

        document
            .querySelectorAll(".draggablePanel")
            .forEach(panel => {

                const rect =
                    panel.getBoundingClientRect();


                let left = rect.left;
                let top = rect.top;


                if (
                    rect.right >
                    window.innerWidth
                ) {

                    left =
                        window.innerWidth -
                        rect.width;

                }


                if (
                    rect.bottom >
                    window.innerHeight
                ) {

                    top =
                        window.innerHeight -
                        rect.height;

                }


                panel.style.left =
                    Math.max(0, left) + "px";

                panel.style.top =
                    Math.max(0, top) + "px";

                panel.style.right =
                    "auto";

            });

    }
);

    <div class="dragHandle">
        PUZZLES
    </div>


    <div id="puzzleContainer">

        <div class="puzzleSectionTitle">
            AVAILABLE PUZZLES
        </div>


        <div id="availablePuzzles"></div>


        <!-- =============================================
             COMPLETED DROPDOWN
             ============================================= -->

        <div
            id="completedDropdown"
            class="completedDropdown"
        >

            <div
                class="completedDropdownHeader"
                onclick="toggleCompletedPuzzles()"
            >

                <span>
                    COMPLETED
                </span>

                <span class="completedArrow">
                    ▼
                </span>

            </div>


            <div id="completedPuzzles"></div>

        </div>

    </div>

</div>

  <!-- ===================================================
         SUBMIT PANEL
         =================================================== -->

    <div
        id="submitPanel"
        class="draggablePanel"
    >

        <div class="dragHandle">
            SUBMIT ROOM
        </div>

        <div id="submitContainer">

            <div class="inputGroup">
                <label for="submitNameInput">Your Name:</label>
                <input type="text" id="submitNameInput" placeholder="Enter your name...">
            </div>

            <!-- NEW: Finished Time Field -->
            <div class="inputGroup">
                <label for="finishedTimeInput">Finished Time Remaining:</label>
                <input type="text" id="finishedTimeInput" placeholder="MM:SS">
                <small style="color: #aaa; font-size: 11px;">Click to edit if needed</small>
            </div>

            <div class="radioGroup">
                <label><input type="radio" name="completionStatus" value="no_help" checked> Group got out with no help</label>
                <label><input type="radio" name="completionStatus" value="with_help"> Group got out with help</label>
                <label><input type="radio" name="completionStatus" value="would_not_without_help"> Group wouldn't have gotten out without help</label>
                <label><input type="radio" name="completionStatus" value="did_not_get_out"> Group did not get out</label>
            </div>

            <button class="submitBtn" onclick="submitRoomData()">Submit</button>

        </div>

    </div>

    <div
    id="mummyPanel"
    class="draggablePanel"
>
    <div class="dragHandle">
        MUMMY BUTTON
    </div>

    <div id="mummyButtonContainer">
        <button id="mummyButton">
            
        </button>
    </div>
</div>
  
</div>

<!-- =======================================================
     TIMER JAVASCRIPT
     ======================================================= -->

<script>

let timerDuration = 60 * 60;
let timerRemaining = timerDuration;
let timerInterval = null;
let timerSpeed = 1;
let lastTimestamp = null;


const timerDisplay =
    document.getElementById(
        'timerDisplay'
    );


const startButton =
    document.getElementById(
        'startButton'
    );


const pauseButton =
    document.getElementById(
        'pauseButton'
    );


const resetButton =
    document.getElementById(
        'resetButton'
    );


const speedSelect =
    document.getElementById(
        'speedSelect'
    );


let timerWindow = null;


/* =========================================================
   OPEN TIMER WINDOW
   ========================================================= */

document
    .getElementById("openTimerWindow")
    .addEventListener(
        "click",
        () => {

            if (
                !timerWindow ||
                timerWindow.closed
            ) {

                timerWindow =
                    window.open(
                        "",
                        "TimerWindow",
                        "width=800,height=400"
                    );


                const doc =
                    timerWindow.document;


                doc.title = "Timer";


                const style =
                    doc.createElement("style");


                style.textContent = `

                    html,
                    body {
                        margin:0;
                        padding:0;
                        height:100%;
                        width:100%;
                        overflow:hidden;
                        font-family:Arial,sans-serif;
                    }

                    @font-face {
                        font-family:heistfont;
                        src:url(heistfont.ttf);
                    }

                    #overlay {
                        background-color:red;
                        color:white;
                        display:flex;
                        justify-content:center;
                        align-items:center;
                        height:100%;
                        width:100%;
                        font-size:1.5em;
                        cursor:pointer;
                        user-select:none;
                    }

                    #timerScreen {
                        display:none;
                        background-color:#111;
                        color:white;
                        height:100%;
                        width:100%;
                        justify-content:center;
                        align-items:center;
                        font-family:'heistfont',monospace;
                        font-size:30em;
                        font-weight:bold;
                    }

                    .timerChar {
                        position:absolute;
                        top:50%;
                        transform:translate(-50%,-50%);
                        text-align:center;
                        width:1ch;
                    }

                    #digit1 {
                        left:10%;
                    }

                    #digit2 {
                        left:30%;
                    }

                    #colon {
                        left:50%;
                    }

                    #digit3 {
                        left:70%;
                    }

                    #digit4 {
                        left:90%;
                    }

                `;


                doc.head.appendChild(style);


                const overlay =
                    doc.createElement("div");


                overlay.id = "overlay";

                overlay.textContent =
                    "Double click to fullscreen";


                doc.body.appendChild(
                    overlay
                );


                const timerScreen =
                    doc.createElement("div");


                timerScreen.id =
                    "timerScreen";


                const digit1 =
                    doc.createElement("span");


                digit1.className =
                    "timerChar";

                digit1.id =
                    "digit1";


                const digit2 =
                    doc.createElement("span");


                digit2.className =
                    "timerChar";

                digit2.id =
                    "digit2";


                const colon =
                    doc.createElement("span");


                colon.className =
                    "timerChar";

                colon.id =
                    "colon";

                colon.textContent =
                    ":";


                const digit3 =
                    doc.createElement("span");


                digit3.className =
                    "timerChar";

                digit3.id =
                    "digit3";


                const digit4 =
                    doc.createElement("span");


                digit4.className =
                    "timerChar";

                digit4.id =
                    "digit4";


                timerScreen.appendChild(
                    digit1
                );

                timerScreen.appendChild(
                    digit2
                );

                timerScreen.appendChild(
                    colon
                );

                timerScreen.appendChild(
                    digit3
                );

                timerScreen.appendChild(
                    digit4
                );


                doc.body.appendChild(
                    timerScreen
                );


                overlay.addEventListener(
                    "dblclick",
                    () => {

                        if (
                            doc.body
                                .requestFullscreen
                        ) {

                            doc.body
                                .requestFullscreen();

                        } else if (
                            doc.body
                                .webkitRequestFullscreen
                        ) {

                            doc.body
                                .webkitRequestFullscreen();

                        } else if (
                            doc.body
                                .msRequestFullscreen
                        ) {

                            doc.body
                                .msRequestFullscreen();

                        }


                        overlay.style.display =
                            "none";


                        timerScreen.style.display =
                            "flex";

                    }
                );


                function updatePopupTimerDisplay(
                    timeStr
                ) {

                    digit1.textContent =
                        timeStr[0];

                    digit2.textContent =
                        timeStr[1];

                    colon.textContent =
                        ":";

                    digit3.textContent =
                        timeStr[3];

                    digit4.textContent =
                        timeStr[4];

                }


                timerWindow.addEventListener(
                    "message",
                    (event) => {

                        if (
                            event.data.timer !==
                            undefined
                        ) {

                            updatePopupTimerDisplay(
                                event.data.timer
                            );

                        }

                    }
                );


                sendTimerUpdate();


            } else {

                timerWindow.focus();

            }

        }
    );


/* =========================================================
   CLOSE TIMER WINDOW
   ========================================================= */

document
    .getElementById("closeTimerWindow")
    .addEventListener(
        "click",
        function() {

            if (
                timerWindow &&
                !timerWindow.closed
            ) {

                timerWindow.close();

            }

        }
    );


/* =========================================================
   SEND TIMER TO POPUP
   ========================================================= */

function sendTimerUpdate() {

    if (
        timerWindow &&
        !timerWindow.closed
    ) {

        const displayValue =
            document
                .getElementById(
                    "timerDisplay"
                )
                .textContent;


        timerWindow.postMessage(
            {
                timer: displayValue
            },
            "*"
        );

    }

}


/* =========================================================
   UPDATE TIMER
   ========================================================= */

function updateTimerDisplay() {

    const minutes =
        Math.floor(
            timerRemaining / 60
        );


    const seconds =
        Math.floor(
            timerRemaining % 60
        );


    timerDisplay.textContent =
        `${minutes
            .toString()
            .padStart(2, '0')
        }:${
            seconds
            .toString()
            .padStart(2, '0')
        }`;


    sendTimerUpdate();

}


/* =========================================================
   TIMER LOOP
   ========================================================= */

function tick(currentTime) {

    if (!lastTimestamp) {

        lastTimestamp =
            currentTime;

    }


    const delta =
        (currentTime -
            lastTimestamp) / 1000;


    lastTimestamp =
        currentTime;


    timerRemaining -=
        delta * timerSpeed;


    if (timerRemaining <= 0) {

        timerRemaining = 0;

        cancelAnimationFrame(
            timerInterval
        );

        timerInterval = null;

    }


    updateTimerDisplay();


    if (timerInterval) {

        timerInterval =
            requestAnimationFrame(
                tick
            );

    }

}


/* =========================================================
   TIMER CONTROLS
   ========================================================= */

function startTimer() {

    if (timerInterval) return;

    lastTimestamp = null;

    timerInterval =
        requestAnimationFrame(
            tick
        );

}


function pauseTimer() {

    cancelAnimationFrame(
        timerInterval
    );

    timerInterval = null;

    lastTimestamp = null;

}


function resetTimer() {

    pauseTimer();

    timerRemaining =
        timerDuration;

    updateTimerDisplay();

}


speedSelect.addEventListener(
    'change',
    (e) => {

        timerSpeed =
            parseFloat(
                e.target.value
            );

    }
);


startButton.addEventListener(
    'click',
    startTimer
);


pauseButton.addEventListener(
    'click',
    pauseTimer
);


resetButton.addEventListener(
    'click',
    resetTimer
);


updateTimerDisplay();

</script>

</body>
</html>
